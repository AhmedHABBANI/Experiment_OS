name: Backend quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            packages/experiment_os_stats/pyproject.toml

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/experiment_os_stats[dev]" -e "backend[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint Python
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=experiment_os_stats --cov-report=term-missing
