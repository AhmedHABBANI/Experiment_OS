services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      EXPERIMENTOS_MAX_CSV_BYTES: ${EXPERIMENTOS_MAX_CSV_BYTES:-5242880}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - backend
